# Stack locale "prod-like".
#
#   docker compose up --build                 # API seule, file inline (comportement d'origine)
#   docker compose --profile async up --build  # + Redis/Postgres/worker séparé (QUEUE_BACKEND=rq côté .env)
#
# Nécessite le NVIDIA Container Toolkit pour exposer le GPU aux conteneurs.
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: simpsons-generator:latest
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./simpsons_lora_results:/srv/simpsons_lora_results:ro
      - ./generated_simpsons:/srv/generated_simpsons
      - db_data:/srv/data
      - hf_cache:/srv/hf_cache
    depends_on:
      redis:
        condition: service_started
        required: false
      postgres:
        condition: service_started
        required: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker:
    image: simpsons-generator:latest
    env_file: .env
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./simpsons_lora_results:/srv/simpsons_lora_results:ro
      - ./generated_simpsons:/srv/generated_simpsons
      - db_data:/srv/data
      - hf_cache:/srv/hf_cache
    depends_on: [redis, postgres]
    profiles: ["async"]
    healthcheck:
      disable: true # pas de serveur HTTP dans le worker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Pas de `ports:` sur redis/postgres : RQ désérialise du pickle, ils ne doivent pas être joignables hors de compose.
  redis:
    image: redis:7-alpine
    profiles: ["async"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simpsons
      POSTGRES_USER: simpsons
      POSTGRES_PASSWORD: simpsons
    volumes:
      - pg_data:/var/lib/postgresql/data
    profiles: ["async"]

volumes:
  db_data:
  hf_cache:
  pg_data:
