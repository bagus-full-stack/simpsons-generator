name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check app tests

      - name: Tests (API contract, sans GPU)
        env:
          SKIP_MODEL_LOAD: "1"
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only : valide que l'image se construit (Dockerfile, requirements.txt).
      # Le déploiement (push registry, GPU) est un job séparé à brancher selon
      # la cible d'hébergement (Runpod/Modal/VM), volontairement hors de ce CI.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: simpsons-generator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
